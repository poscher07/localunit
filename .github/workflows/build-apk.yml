name: Build LocalUnit Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: localunit/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: localunit
        run: npm install

      - name: Generate Android project
        working-directory: localunit
        env:
          CI: 1
        run: npx expo prebuild --platform android

      - name: Assemble release APK
        working-directory: localunit
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalUnit-APK
          path: localunit/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
